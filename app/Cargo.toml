[package]
name = "live-remote"
version = "0.1.0"
license = "MIT"
description = "Control Ableton Live from a phone or tablet browser"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
eframe = "0.37"
futures-util = "0.3"
if-addrs = "0.15"
include_dir = "0.7"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
